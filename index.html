<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#08080a" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('portfolio-theme');
          if (saved === 'light') {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
          } else {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <title>Ekezie Chiemelie Isaac — Full-Stack Engineer &amp; Visual Designer</title>

    <meta
      name="description"
      content="Portfolio of Ekezie Chiemelie Isaac. Full-Stack Software Engineer &amp; Visual Designer. Living between strict backend architecture and expressive graphic design."
